title: Lihua Lan
author: Lihua Lan
lang: en
description: "My graduate school journey: tech notes, study notes, and projects"
baseurl: ""
url: "https://alilan.github.io"
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-paginate
include:
  - _pages
markdown: kramdown
permalink: /:year/:month/:day/:title/
paginate: 5
paginate_path: "/page/:num/"

# SEO Settings
seo:
  title: "Lihua Lan - Graduate Notes & Projects"
  description: "My graduate school journey: tech articles, study notes, and project write-ups"
  author: "Lihua Lan"
  image: "/assets/images/og-image.jpg"
  twitter:
    creator: "@your_twitter_handle"

# Social Media
social:
  name: Lihua Lan
  links:
    - https://github.com/AliLan
    - https://linkedin.com/in/your-profile
    - mailto:lihualan2025@gmail.com

# Collections
collections:
  posts:
    output: true
    permalink: /:collection/:title/

# Archives
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: archive-category
    tag: archive-tag
  permalinks:
    category: '/category/:name/'
    tag: '/tag/:name/'

minima:
  include_css:
    - /assets/css/custom.css
  social_links:
    github: AliLan
    email: lihualan2025@gmail.com