title: Lihua Lan
author: Lihua Lan
lang: en
description: "Software engineer and M.S. Computer Science student at CSULB: AI, information retrieval, and VR"
baseurl: ""
url: "https://alilan.github.io"
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-paginate
include:
  - _pages
markdown: kramdown
permalink: /:year/:month/:day/:title/
paginate: 5
paginate_path: "/page/:num/"

# Share preview image (og:image / twitter:image) for every page
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/profile.jpg

# Social Media
social:
  name: Lihua Lan
  links:
    - https://github.com/AliLan
    - https://www.linkedin.com/in/lihualan
    - mailto:lihualan2025@gmail.com

# Collections
collections:
  posts:
    output: true
    permalink: /:collection/:title/

# Archives
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: archive-category
    tag: archive-tag
  permalinks:
    category: '/category/:name/'
    tag: '/tag/:name/'

minima:
  include_css:
    - /assets/css/custom.css
  social_links:
    github: AliLan
    email: lihualan2025@gmail.com