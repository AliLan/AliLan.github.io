<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CECS 530 Midterm Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* Layout: a single study desk — topic tabs, one large flip card, then recall controls. Copper = the circuit-board trace accent. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #18222e;
  --muted: #5b6878;
  --line: #d3dae2;
  --accent: #b5592a;        /* copper trace */
  --accent-soft: #f6e4d9;
  --cool: #2a5f8f;          /* silicon blue for the back face */
  --cool-soft: #e2edf7;
  --good: #2f7d4f;
  --good-soft: #dcefe3;
  --zh: #8a4a22;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "IBM Plex Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #1a2129; --ink: #e6ebf0; --muted: #94a2b2; --line: #2c3742;
    --accent: #e08a58; --accent-soft: #3a2a20; --cool: #7fb2e0; --cool-soft: #1c2c3c;
    --good: #6cc391; --good-soft: #1d3327; --zh: #e9b38d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #1a2129; --ink: #e6ebf0; --muted: #94a2b2; --line: #2c3742;
  --accent: #e08a58; --accent-soft: #3a2a20; --cool: #7fb2e0; --cool-soft: #1c2c3c;
  --good: #6cc391; --good-soft: #1d3327; --zh: #e9b38d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
header { display: grid; gap: 4px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 5vw, 36px); line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 14px; }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab {
  font: 500 14px var(--body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer;
  display: inline-flex; gap: 8px; align-items: center;
}
.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab[aria-pressed="true"] .n { color: var(--bg); opacity: .7; }

.status { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
.status .count { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--good); transition: width .3s; }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

/* card: both faces share one grid cell so the card grows to the taller face */
.scene { perspective: 1400px; }
.card { display: grid; transition: transform .45s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; cursor: pointer; outline: none; }
.card.flipped { transform: rotateY(180deg); }
.card:focus-visible .face { box-shadow: 0 0 0 3px var(--accent); }
.face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 28px 28px 24px; min-height: 300px; display: grid; grid-template-rows: auto 1fr auto; gap: 14px;
}
.face.back { transform: rotateY(180deg); background: var(--cool-soft); border-color: transparent; }
.meta { display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.meta .src { color: var(--accent); }
.back .meta .src { color: var(--cool); }
.term { align-self: center; display: grid; gap: 8px; }
.term h2 { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 5.2vw, 34px); line-height: 1.15; margin: 0; text-wrap: balance; }
.term .zhterm { font-size: 17px; color: var(--zh); }
.prompt { font-size: 14px; color: var(--muted); }
.def { align-self: start; min-width: 0; }
.def p { margin: 0 0 10px; max-width: 62ch; }
.def ul { margin: 0 0 10px; padding-left: 20px; }
.def li { margin-bottom: 4px; }
.def .ex { border-left: 3px solid var(--cool); padding: 6px 0 6px 12px; margin-top: 6px; font-size: 15px; }
.def .ex b { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--cool); display: block; }
.def code, .def .f { font-family: var(--mono); font-size: 14px; background: var(--surface); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.zh { color: var(--zh); font-size: .92em; }
.hint { font-size: 12px; color: var(--muted); text-align: center; }

.controls { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 10px; }
button.btn {
  font: 600 15px var(--body); border-radius: 10px; padding: 12px 16px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
button.btn:focus-visible, .tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.again { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
button.got { background: var(--good-soft); border-color: transparent; color: var(--good); }
button.icon { font-family: var(--mono); padding-inline: 14px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.tools .left { display: flex; gap: 8px; flex-wrap: wrap; }
.small { font: 500 13px var(--body); padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.small:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.keys { font-size: 12px; color: var(--muted); }
.keys kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--surface); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 40px 24px; text-align: center; color: var(--muted); }
.empty strong { display: block; font-family: var(--display); font-size: 22px; color: var(--ink); margin-bottom: 6px; }

@media (max-width: 520px) {
  .face { padding: 22px 18px 18px; min-height: 280px; }
  .controls { grid-template-columns: 1fr 1fr; }
  .controls .icon { order: 2; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  .bar > i { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">CECS 530 · Midterm · Lectures 1–3</span>
    <h1>Definition flashcards</h1>
    <p class="sub">Say the definition out loud, then flip. Words a young child wouldn't know have Chinese in <span class="zh">(括号)</span>.</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="Topic"></nav>

  <div>
    <div class="status">
      <span><span class="count" id="count">1 / 1</span> · <span id="knownTxt"></span></span>
      <label class="toggle"><input type="checkbox" id="onlyNew"> Only cards I'm still learning</label>
    </div>
    <div class="bar" style="margin-top:8px"><i id="bar"></i></div>
  </div>

  <div id="stage"></div>

  <div class="controls" id="controls">
    <button class="btn icon" id="prev" aria-label="Previous card">←</button>
    <button class="btn again" id="again">Still learning</button>
    <button class="btn got" id="got">I know this</button>
    <button class="btn icon" id="next" aria-label="Next card">→</button>
  </div>

  <div class="tools">
    <div class="left">
      <button class="small" id="shuffle">Shuffle</button>
      <button class="small" id="reset">Reset progress</button>
    </div>
    <span class="keys"><kbd>Space</kbd> flip · <kbd>←</kbd><kbd>→</kbd> move · <kbd>1</kbd> still learning · <kbd>2</kbd> know it</span>
  </div>
</div>

<script>
const Z = s => `<span class="zh">(${s})</span>`;
const EX = (s) => `<div class="ex"><b>Example</b>${s}</div>`;
const KEY = (s) => `<div class="ex"><b>Key point</b>${s}</div>`;

const TOPICS = {
  fund: "Quantitative Design",
  mem: "Memory Hierarchy",
  vm: "Virtual Memory"
};

const CARDS = [
/* ===== Fundamentals of Quantitative Design (Lecture 1 + 2) ===== */
{t:"fund", s:"L2", f:"Response time", zh:"响应时间", b:`<p>The time from the <b>start</b> to the <b>finish</b> of one task. Also called execution time. Lower is better.</p>${KEY("This is what one user cares about: “Is my program done yet?”")}`},
{t:"fund", s:"L2", f:"Throughput", zh:"吞吐量", b:`<p>The total amount of work done in a given time, e.g. tasks per hour. Higher is better.</p>${KEY("This is what a server administrator cares about.")}${EX("1,000 transactions/hour")}`},
{t:"fund", s:"L2", f:"Elapsed time vs. CPU time", zh:"总耗时 vs CPU 时间", b:`<p><b>Elapsed time</b> (wall-clock time): total time from start to end, <i>including</i> I/O, memory, OS overhead ${Z("开销")} and waiting.</p><p><b>CPU time</b>: only the time the processor actually spends computing for this program. It <i>excludes</i> I/O waiting and other programs.</p>${EX("Elapsed 10 s, CPU time 6 s.")}`},
{t:"fund", s:"L2", f:"Performance and “n times as fast”", zh:"性能与“快 n 倍”", b:`<p>Performance = 1 / Execution time. A faster computer finishes the same task in less time.</p><p>“X is n times as fast as Y” means <span class="f">n = Time_Y / Time_X</span>.</p>${EX("X takes 5 s, Y takes 10 s → X is 2× as fast.")}`},
{t:"fund", s:"L1", f:"Moore's Law", zh:"摩尔定律", b:`<p>The historical trend that the number of transistors ${Z("晶体管")} on a chip doubles about every 18–24 months.</p><p>This growth has slowed down in recent years.</p>${EX("2015 → 2025 = 5 doublings → about 2⁵ = 32× more transistors.")}`},
{t:"fund", s:"L1", f:"Dennard scaling", zh:"登纳德缩放", b:`<p>As transistors got smaller, their power use also went down, so <b>power per area stayed about the same</b>.</p><p>It <b>ended around 2004</b>: voltage ${Z("电压")} could no longer keep dropping. Faster single cores became too hot, so the industry moved to <b>multicore</b> ${Z("多核")} processors.</p>`},
{t:"fund", s:"L1", f:"RISC", zh:"精简指令集计算机", b:`<p><b>Reduced Instruction Set Computer.</b> An ISA style with simple instructions that can run fast and efficiently.</p><p>Key ideas that came with it: pipelining, multiple instruction issue, and cache memory.</p>`},
{t:"fund", s:"L1", f:"Pipelining", zh:"流水线", b:`<p>A technique that lets several instructions <b>overlap</b> ${Z("重叠")} in execution, like an assembly line. Each stage works on a different instruction at the same time.</p>${KEY("It is a way to exploit ILP.")}`},
{t:"fund", s:"L1", f:"Five classes of computers", zh:"五类计算机", b:`<ul><li><b>IoT / Embedded</b> ${Z("嵌入式")}: low cost, low energy, one specific job (smartwatch, car)</li><li><b>Personal mobile devices</b>: energy, cost, responsiveness (phones)</li><li><b>Desktop</b>: price-performance, graphics</li><li><b>Servers</b>: throughput, availability ${Z("可用性")}, scalability ${Z("可扩展性")}</li><li><b>Clusters / WSCs</b> (warehouse-scale computers): price-performance, throughput, energy</li></ul>`},
{t:"fund", s:"L1", f:"Data-level vs. task-level parallelism", zh:"数据级 vs 任务级并行", b:`<p>Two kinds of parallelism ${Z("并行性")} found in <b>applications</b>:</p><ul><li><b>DLP</b>: many data items processed at once with the same operation (thousands of image pixels).</li><li><b>Task-level</b>: many independent tasks run at once (video, audio and network handled together).</li></ul>`},
{t:"fund", s:"L1", f:"ILP — Instruction-Level Parallelism", zh:"指令级并行", b:`<p>Hardware runs or overlaps <b>multiple instructions</b> at the same time.</p>${EX(`Pipelining, superscalar ${Z('超标量')}, speculative execution ${Z('推测执行')}.`)}`},
{t:"fund", s:"L1", f:"Vector / SIMD / GPU (DLP in hardware)", zh:"向量/SIMD/GPU", b:`<p>Hardware applies the <b>same operation to many data elements</b> in parallel. It mainly exploits data-level parallelism.</p>`},
{t:"fund", s:"L1", f:"TLP — Thread-Level Parallelism", zh:"线程级并行", b:`<p>Hardware runs <b>multiple threads</b> ${Z("线程")} in parallel, usually on different cores.</p>${EX("A multicore processor.")}`},
{t:"fund", s:"L1", f:"RLP — Request-Level Parallelism", zh:"请求级并行", b:`<p>Many <b>independent requests</b> are handled at the same time.</p>${EX("A web server serving many users; data centers.")}${KEY("ILP → instructions · DLP → data · TLP → threads · RLP → requests")}`},
{t:"fund", s:"L1", f:"Flynn's taxonomy", zh:"弗林分类法", b:`<p>Classifies ${Z("分类")} computers by the number of <b>instruction streams</b> and <b>data streams</b>:</p><ul><li><b>SISD</b>: single instruction, single data → a traditional single processor</li><li><b>SIMD</b>: single instruction, multiple data → vector processors, GPUs</li><li><b>MISD</b>: multiple instructions, single data → rarely used</li><li><b>MIMD</b>: multiple instructions, multiple data → multicore, clusters, WSCs</li></ul>`},
{t:"fund", s:"L1", f:"ISA — Instruction Set Architecture", zh:"指令集架构", b:`<p>The <b>interface</b> ${Z("接口")} between software and hardware. It defines the instructions and features the programmer can see.</p>${EX("RISC-V, ARMv8, x86")}<p style="margin-top:10px">Its dimensions: class (register-memory or load-store), memory addressing, addressing modes, operand types and sizes, operations, control flow, instruction encoding ${Z("编码")}.</p>`},
{t:"fund", s:"L1", f:"Microarchitecture (organization) vs. hardware", zh:"微架构 vs 硬件", b:`<p><b>Microarchitecture</b>: <i>how</i> the ISA is implemented ${Z("实现")}, e.g. the pipeline and caches.</p><p><b>Hardware</b>: the physical implementation — the actual chip and circuits ${Z("电路")}.</p>${KEY("Computer architecture = ISA + microarchitecture + hardware.")}`},
{t:"fund", s:"L1", f:"Latency vs. bandwidth", zh:"延迟 vs 带宽", b:`<p><b>Latency</b>: time to get one specific piece of data.</p><p><b>Bandwidth</b>: how much data can be moved per unit of time.</p>${KEY("Historically bandwidth improved much faster than latency.")}`},
{t:"fund", s:"L1", f:"Feature size and wire delay", zh:"特征尺寸与线延迟", b:`<p><b>Feature size</b>: the smallest size of a transistor or wire on a chip. Smaller → more transistors fit.</p><p><b>Wire delay</b>: wires do not scale as well as transistors. Their delay depends on resistance ${Z("电阻")} × capacitance ${Z("电容")} (RC), so wire delay became a performance limit.</p>`},
{t:"fund", s:"L1", f:"Dynamic power", zh:"动态功耗", b:`<p>Power used when transistors <b>switch</b> on and off.</p><p><span class="f">P_dynamic ∝ V² × f</span> (voltage squared × frequency ${Z("频率")}).</p>${KEY("Lowering voltage helps the most because it is squared. Halving V and f → power becomes 1/8.")}`},
{t:"fund", s:"L1", f:"Static power and power gating", zh:"静态功耗与电源门控", b:`<p><b>Static power</b>: power used even when transistors are <b>not switching</b>, caused by leakage current ${Z("漏电流")}. More transistors → more leakage.</p><p><b>Power gating</b> ${Z("电源门控")}: turn off the power to idle parts to stop leakage.</p>`},
{t:"fund", s:"L1", f:"Peak power and TDP", zh:"峰值功耗与热设计功耗", b:`<p><b>Peak power</b>: the maximum power the processor may need. Not enough supply → voltage drops → the chip malfunctions ${Z("故障")}.</p><p><b>TDP (Thermal Design Power)</b>: sets how much cooling ${Z("散热")} is needed. Too hot → the clock slows down; extremely hot → shutdown.</p>`},
{t:"fund", s:"L1", f:"Power vs. energy", zh:"功率 vs 能量", b:`<p><span class="f">Energy = Average power × Time</span>. Power is the rate; energy is the total.</p><p><b>Energy per task</b> is the best measure of efficiency ${Z("效率")}.</p>${EX("A: 120 W × 7 s = 840 J. B: 100 W × 10 s = 1000 J. A uses more power but less energy.")}`},
{t:"fund", s:"L1", f:"Die yield", zh:"良率", b:`<p>The percentage of manufactured dies ${Z("晶片")} that work correctly.</p><p>Smaller die → more dies per wafer ${Z("晶圆")} and higher yield → lower cost. New processes have higher defect ${Z("缺陷")} rates; older ones are more mature ${Z("成熟")}.</p>${KEY("Cost of die = Cost of wafer / (Dies per wafer × Die yield). Watch units: 100 mm² = 1 cm².")}`},
{t:"fund", s:"L1", f:"Factors that lower chip cost", zh:"降低成本的因素", b:`<ul><li><b>Learning curve</b>: cost drops over time as manufacturing improves</li><li>Higher <b>yield</b></li><li>Higher production <b>volume</b> ${Z("产量")}</li><li><b>Commoditization</b> ${Z("商品化")} and competition</li></ul>`},
{t:"fund", s:"L1", f:"Dependability", zh:"可信性/可靠性", b:`<p>The ability of a system to provide reliable service. A system is either in <b>service accomplishment</b> (working correctly) or <b>service interruption</b> ${Z("服务中断")}.</p><p><b>Failure</b>: accomplishment → interruption. <b>Restoration</b> ${Z("恢复")}: interruption → accomplishment.</p><p><b>SLA</b> (Service Level Agreement): defines the expected level of service.</p>`},
{t:"fund", s:"L1", f:"Transient vs. permanent fault", zh:"瞬态 vs 永久故障", b:`<p><b>Transient fault</b> ${Z("瞬态故障")}: temporary; goes away by itself.</p><p><b>Permanent fault</b>: stays until the part is repaired or replaced.</p>`},
{t:"fund", s:"L1", f:"MTTF, MTTR, MTBF", zh:"平均失效/修复/故障间隔时间", b:`<ul><li><b>MTTF</b> (Mean Time To Failure): average working time before a failure</li><li><b>MTTR</b> (Mean Time To Repair): average time to fix and restore</li><li><b>MTBF</b> = MTTF + MTTR</li></ul>${KEY("If any one part's failure kills the system, failure rates (1/MTTF) ADD. So more parts → lower system MTTF.")}`},
{t:"fund", s:"L1", f:"FIT — Failures In Time", zh:"失效率单位", b:`<p>A failure rate: <b>1 FIT = 1 failure per 10⁹ device-hours</b>. Higher FIT → less reliable.</p><p><span class="f">MTTF = 10⁹ / FIT</span></p>${EX("FIT = 100 → MTTF = 10⁷ hours. 1000 such processors in series → 100,000 FIT → 10⁴ hours.")}`},
{t:"fund", s:"L1", f:"Availability", zh:"可用性", b:`<p>The fraction of time a system is working.</p><p><span class="f">Availability = MTTF / (MTTF + MTTR)</span></p>${KEY("Higher MTTF + lower MTTR → higher availability.")}${EX("1000 / (1000 + 10) ≈ 99.01%")}`},
{t:"fund", s:"L1", f:"Redundancy", zh:"冗余", b:`<p>Adding extra copies so the system keeps working after one part fails. The system fails only if the backup also fails <b>before the first one is repaired</b>.</p><p><span class="f">MTTF_pair ≈ MTTF² / (2 × MTTR)</span></p>${EX("Two power supplies: 200,000 h each, MTTR 24 h → ≈ 830 million hours.")}`},
{t:"fund", s:"L2", f:"Benchmark", zh:"基准测试", b:`<p>A program used to compare the performance of different computers. <b>Real applications</b> are the best benchmarks.</p><p>Weaker kinds: <b>kernels</b> ${Z("核心代码片段")}, <b>toy programs</b>, <b>synthetic benchmarks</b> ${Z("合成基准")} — they may not match real workloads ${Z("工作负载")}.</p><p>A <b>benchmark suite</b> ${Z("套件")} is a collection of them, e.g. <b>SPEC</b>.</p>`},
{t:"fund", s:"L2", f:"SPECRatio", zh:"SPEC 比率", b:`<p>Performance normalized ${Z("归一化")} to a reference computer:</p><p><span class="f">SPECRatio = Time_reference / Time_computer</span>. Higher is better.</p>${EX("Reference 10 s, Computer A 5 s → SPECRatio 2.")}`},
{t:"fund", s:"L2", f:"Why the geometric mean?", zh:"为什么用几何平均", b:`<p>SPEC summarizes many ratios with <span class="f">GM = ⁿ√(R₁ × R₂ × … × Rₙ)</span>.</p>${KEY("With the geometric mean, the choice of reference computer cancels out, so comparing two machines gives the same answer whatever reference you use.")}`},
{t:"fund", s:"L2", f:"Principle of locality", zh:"局部性原理", b:`<p>Programs tend to reuse data and instructions they used <b>recently</b>, and to use things <b>near</b> what they just used.</p><p>Two kinds: <b>temporal</b> ${Z("时间")} and <b>spatial</b> ${Z("空间")} locality. It is the reason caches work.</p>`},
{t:"fund", s:"L2", f:"Make the common case fast", zh:"加速常见情况", b:`<p>Optimize the operations that happen <b>most often</b>; they have the biggest effect on overall performance. Rare cases can be slower.</p>${EX("Instruction fetch and decode happen all the time → optimize them.")}`},
{t:"fund", s:"L2", f:"Amdahl's Law", zh:"阿姆达尔定律", b:`<p>The overall speedup from improving <b>part</b> of a system is limited by the part that is <b>not</b> improved.</p><p><span class="f">Speedup = 1 / ((1 − F) + F/S)</span></p><p>F = fraction of the <b>original</b> time that can be enhanced; S = speedup of that part.</p>${EX("F = 0.4, S = 10 → only 1.56× overall.")}`},
{t:"fund", s:"L2", f:"Clock cycle, clock cycle time, clock rate", zh:"时钟周期/周期时间/时钟频率", b:`<ul><li><b>Clock cycle</b>: one tick of the processor clock</li><li><b>Clock cycle time</b>: how long one tick takes (e.g. 0.25 ns)</li><li><b>Clock rate</b>: ticks per second (e.g. 4 GHz)</li></ul><p><span class="f">Cycle time = 1 / Clock rate</span></p>`},
{t:"fund", s:"L2", f:"Instruction count, CPI, IPC", zh:"指令数/每条指令周期数", b:`<ul><li><b>IC</b>: number of instructions the program executes</li><li><b>CPI</b>: average clock cycles per instruction = Clock cycles / IC</li><li><b>IPC</b>: instructions per clock = 1 / CPI</li></ul>${KEY("Average CPI = Σ (fraction of type × CPI of type).")}`},
{t:"fund", s:"L2", f:"Processor performance equation", zh:"处理器性能公式", b:`<p><span class="f">CPU time = IC × CPI × Clock cycle time</span> = IC × CPI / Clock rate</p>${KEY("Lower any of the three → less CPU time. If IC and clock stay the same, Speedup = CPI_old / CPI_new.")}`},
{t:"fund", s:"L2", f:"Fallacy: multiprocessors are a silver bullet", zh:"谬误：多处理器是万能药", b:`<p>Adding more processors does <b>not</b> automatically make things faster. Software must have enough parallelism to use them, and more cores do not always mean less power.</p>`},
{t:"fund", s:"L2", f:"Fallacy: peak performance = real performance", zh:"谬误：峰值性能 = 实际性能", b:`<p>Peak performance is a theoretical maximum ${Z("理论最大值")}. Real programs reach only part of it, depending on workload, memory behavior, parallelism and software.</p>`},
{t:"fund", s:"L2", f:"Pitfalls: ignoring Amdahl / trusting trends forever", zh:"陷阱", b:`<p><b>Ignoring Amdahl's Law</b>: speeding up a rarely used part gives little overall gain. Measure first.</p><p><b>Assuming exponential ${Z("指数")} trends continue forever</b>: Dennard scaling ended and Moore's Law slowed.</p>`},

/* ===== Memory Hierarchy (Lecture 3) ===== */
{t:"mem", s:"L3", f:"Why a memory hierarchy?", zh:"为什么要存储层次结构", b:`<p>We want memory that is fast, large and cheap, but no single technology gives all three.</p><p>So we use several levels: small and fast near the CPU, large and cheap far away. Goal: speed close to the fastest level, cost close to the cheapest.</p>${KEY("It works because programs have locality.")}`},
{t:"mem", s:"L3", f:"Hierarchy levels and trends", zh:"层次与趋势", b:`<p>Registers → L1 → L2 → L3 → Main memory → Secondary storage ${Z("外存")}</p><p>Moving <b>away</b> from the CPU: capacity ${Z("容量")} ↑, access time ↑, cost per byte ↓.</p>`},
{t:"mem", s:"L3", f:"Processor–memory performance gap", zh:"处理器-内存性能差距", b:`<p>Processor speed improved much faster than DRAM latency, so the CPU often waits for memory. Multicore makes bandwidth demand even higher.</p>${KEY("Caches and multi-level hierarchies hide this gap.")}`},
{t:"mem", s:"L3", f:"Temporal locality", zh:"时间局部性", b:`<p>Data or instructions used <b>recently</b> are likely to be used <b>again soon</b>.</p>${EX("A loop counter or a variable used again and again inside a loop.")}`},
{t:"mem", s:"L3", f:"Spatial locality", zh:"空间局部性", b:`<p>Data or instructions <b>near</b> a recently used address are likely to be used soon.</p>${EX("Reading array elements one after another.")}${KEY("This is why caches move whole blocks, not single words.")}`},
{t:"mem", s:"L3", f:"Cache hit, cache miss, miss penalty", zh:"命中/缺失/缺失代价", b:`<p><b>Hit</b>: the data is in the cache → fast.</p><p><b>Miss</b>: the data is not there → fetch it from a lower level.</p><p><b>Miss penalty</b> ${Z("缺失代价")}: the extra time to get the block from the next level.</p>`},
{t:"mem", s:"L3", f:"Block (cache line)", zh:"块/缓存行", b:`<p>The unit of data moved between cache and memory. It holds several neighboring words, which exploits spatial locality.</p>`},
{t:"mem", s:"L3", f:"Tag and valid bit", zh:"标记与有效位", b:`<p><b>Tag</b>: the upper address bits stored with each block. It tells <i>which</i> memory block is in that cache spot, because many addresses map to the same spot.</p><p><b>Valid bit</b>: says whether the entry holds real data.</p>${KEY("Total cache bits = #blocks × (data + tag + valid). The data size alone is not the whole cache.")}`},
{t:"mem", s:"L3", f:"Direct-mapped cache", zh:"直接映射", b:`<p>Each memory block has <b>exactly one</b> possible place (1-way). <span class="f">Location = Block address mod #blocks</span></p><p>Simple and fast, but different blocks fight for the same spot → <b>conflict misses</b>.</p>`},
{t:"mem", s:"L3", f:"Set-associative cache", zh:"组相联", b:`<p>The cache is split into <b>sets</b>; each set has n blocks (<b>n-way</b>). A block maps to one set but can go in <b>any way</b> of that set.</p><p><span class="f">Set = Block address mod #sets</span></p>`},
{t:"mem", s:"L3", f:"Fully associative cache", zh:"全相联", b:`<p>The whole cache is <b>one set</b>; a block can go <b>anywhere</b>. Most flexible, so <b>no index bits</b> — address = tag + offset.</p>`},
{t:"mem", s:"L3", f:"Address fields: tag | index | offset", zh:"地址字段", b:`<ul><li><b>Offset</b> = log₂(block size in bytes) → which byte in the block</li><li><b>Index</b> = log₂(#sets) → which set / line</li><li><b>Tag</b> = the remaining bits → is it the right block?</li></ul>${KEY("More associativity → fewer sets → fewer index bits → more tag bits.")}`},
{t:"mem", s:"L3", f:"Write-through", zh:"写直达", b:`<p>On a write, update the cache <b>and</b> main memory right away. Memory is always up to date, but there are many memory writes.</p>`},
{t:"mem", s:"L3", f:"Write-back", zh:"写回", b:`<p>On a write, update <b>only the cache</b>. Main memory is updated later, when the changed block is <b>replaced</b>. Fewer writes to memory.</p>`},
{t:"mem", s:"L3", f:"Write buffer", zh:"写缓冲", b:`<p>A small buffer that holds pending writes so the processor or cache can keep going without waiting for the slow memory write. Works with both write-through and write-back.</p>`},
{t:"mem", s:"L3", f:"Miss rate and misses per instruction", zh:"缺失率", b:`<p><b>Miss rate</b>: fraction of accesses that miss.</p><p><span class="f">Misses/instruction = Miss rate × Memory accesses/instruction</span> (often per 1000 instructions).</p>${KEY("Neither one includes the miss penalty, so both can be misleading.")}`},
{t:"mem", s:"L3", f:"AMAT", zh:"平均访存时间", b:`<p>Average Memory Access Time — a fuller measure of cache performance:</p><p><span class="f">AMAT = Hit time + Miss rate × Miss penalty</span></p><p>Two levels: <span class="f">Hit_L1 + MR_L1 × (Hit_L2 + MR_L2 × Penalty_L2)</span></p>`},
{t:"mem", s:"L3", f:"Memory stall cycles and effective CPI", zh:"存储停顿与有效 CPI", b:`<p><span class="f">Effective CPI = Base CPI + Misses/instr × Miss penalty (cycles)</span></p>${EX("4 GHz → 0.25 ns/cycle; 100 ns = 400 cycles; 0.02 × 400 = 8 → CPI goes from 1 to 9.")}`},
{t:"mem", s:"L3", f:"The three kinds of misses", zh:"三类缺失", b:`<ul><li><b>Compulsory</b> ${Z("强制")}: first access to a block; it was never in the cache</li><li><b>Capacity</b> ${Z("容量")}: the cache is too small to hold everything needed</li><li><b>Conflict</b> ${Z("冲突")}: too many blocks map to the same set</li></ul>`},
{t:"mem", s:"L3", f:"Optimization: larger block size", zh:"增大块大小", b:`<p>Uses spatial locality → fewer <b>compulsory</b> misses.</p><p>Trade-off ${Z("权衡")}: higher miss penalty; very large blocks can raise capacity and conflict misses.</p>`},
{t:"mem", s:"L3", f:"Optimization: bigger cache", zh:"增大缓存", b:`<p>Holds more blocks → fewer <b>capacity</b> misses.</p><p>Trade-off: longer hit time, higher cost and power.</p>`},
{t:"mem", s:"L3", f:"Optimization: higher associativity", zh:"提高相联度", b:`<p>More places for each block → fewer <b>conflict</b> misses.</p><p>Trade-off: more ways to check → longer hit time and more power.</p>`},
{t:"mem", s:"L3", f:"Optimization: multilevel caches", zh:"多级缓存", b:`<p>A small, fast L1 for short hit time, plus larger L2/L3 to avoid slow trips to main memory. Goal: <b>reduce the miss penalty</b>.</p>`},
{t:"mem", s:"L3", f:"Optimization: read misses before writes", zh:"读缺失优先于写", b:`<p>Writes wait in the write buffer, so a read miss can be served first (when there is no address conflict). This lowers the <b>read miss penalty</b>.</p>`},
{t:"mem", s:"L3", f:"Optimization: avoid address translation during indexing", zh:"索引时避免地址转换", b:`<p>Use the <b>page offset</b> (which does not change in translation) to index the cache, so the cache lookup starts before the virtual→physical translation is done. This lowers <b>hit time</b>.</p>`},
{t:"mem", s:"L3", f:"Access time vs. cycle time (memory)", zh:"访问时间 vs 周期时间", b:`<p><b>Access time</b>: time from a read request until the word arrives.</p><p><b>Cycle time</b>: the minimum time between two unrelated requests.</p><p><span class="f">Cycle time ≥ Access time</span></p>`},
{t:"mem", s:"L3", f:"SRAM vs. DRAM", zh:"静态 vs 动态随机存储器", b:`<p><b>SRAM</b>: several transistors per bit, no refresh, very fast, expensive, low density ${Z("密度")} → caches.</p><p><b>DRAM</b>: one transistor + one capacitor ${Z("电容")} per bit, needs refresh, slower, cheap, high density → main memory.</p>`},
{t:"mem", s:"L3", f:"SRAM vs. DRAM vs. disk", zh:"三者对比", b:`<p>Going SRAM → DRAM → Flash/SSD → magnetic disk ${Z("磁盘")}:</p><ul><li>Access time: fastest → slowest</li><li>Capacity: smallest → largest</li><li>Cost per bit: highest → lowest</li></ul>`},
{t:"mem", s:"L3", f:"How DRAM is accessed (RAS / CAS)", zh:"DRAM 行/列访问", b:`<p>DRAM is a grid of rows and columns. Address: <b>Bank → Row → Column</b>.</p><ol style="padding-left:20px;margin:0 0 10px"><li><b>RAS / Activate</b>: open a row; copy it into the <b>row buffer</b></li><li><b>CAS</b>: pick the needed column from the open row</li></ol>`},
{t:"mem", s:"L3", f:"DRAM refresh and precharge", zh:"刷新与预充电", b:`<p><b>Refresh</b>: the stored charge leaks away, so DRAM must be rewritten regularly. Memory may be busy during refresh.</p><p><b>Precharge</b> ${Z("预充电")}: before opening a different row in the same bank, close the current row and prepare the bank. Adds delay.</p>`},
{t:"mem", s:"L3", f:"SDRAM and burst mode", zh:"同步 DRAM 与突发传输", b:`<p><b>SDRAM</b>: synchronous ${Z("同步")} DRAM, clocked together with the memory controller ${Z("控制器")}.</p><p><b>Burst mode</b>: after one address, many consecutive data items transfer without new addresses → higher bandwidth.</p>`},
{t:"mem", s:"L3", f:"DRAM banks", zh:"存储体", b:`<p>DRAM is split into <b>banks</b>, each with its own row buffer. Accesses to different banks can overlap (one precharges while another sends data) → more parallelism and bandwidth.</p>`},
{t:"mem", s:"L3", f:"Flash memory", zh:"闪存", b:`<ul><li><b>Nonvolatile</b> ${Z("非易失")}: keeps data without power; used in SSDs</li><li>Slower than DRAM</li><li>Read in <b>pages</b>; must <b>erase</b> before rewriting, and erase works on larger <b>blocks</b></li><li>Limited write/erase cycles</li></ul>`},
{t:"mem", s:"L3", f:"Hard vs. soft errors", zh:"硬错误 vs 软错误", b:`<p><b>Hard error</b>: permanent circuit failure; may be fixed with <b>spare rows</b>.</p><p><b>Soft error</b>: a temporary change in stored data; the hardware is not damaged.</p>`},
{t:"mem", s:"L3", f:"Parity vs. ECC", zh:"奇偶校验 vs 纠错码", b:`<p><b>Parity</b> ${Z("奇偶校验")}: can <b>detect</b> an error but cannot fix it.</p><p><b>ECC</b> (Error-Correcting Code): can <b>detect and correct</b> errors. Used in main memory and large caches.</p>`},
{t:"mem", s:"L3", f:"Five goals of advanced cache optimizations", zh:"高级优化五个目标", b:`<ul><li>Reduce <b>hit time</b></li><li>Increase cache <b>bandwidth</b></li><li>Reduce <b>miss penalty</b></li><li>Reduce <b>miss rate</b></li><li>Use <b>parallelism and prefetching</b> ${Z("预取")}</li></ul>`},
{t:"mem", s:"L3", f:"Small and simple L1 cache", zh:"小而简单的 L1", b:`<p>Goal: <b>lower hit time and power</b>. L1 is accessed first, so it must be fast. Larger or more associative caches take longer per hit.</p>${KEY("A cache with a lower miss rate can still have a worse AMAT if its hit time is longer.")}`},
{t:"mem", s:"L3", f:"Way prediction", zh:"路预测", b:`<p>In a set-associative cache, <b>guess</b> which way holds the block and check it first.</p><p>Right guess → fast hit. Wrong guess → check the other ways, extra delay. Saves hit time and power.</p>`},
{t:"mem", s:"L3", f:"Pipelined and multibanked caches", zh:"流水线与多体缓存", b:`<p>Goal: <b>more cache bandwidth</b>.</p><p><b>Pipelined access</b>: split a cache access into stages → higher clock rate, but each access may take more cycles.</p><p><b>Multibanked</b>: split the cache into independent banks; sequential blocks are spread across banks so several accesses happen per cycle.</p>`},

/* ===== Virtual Memory (Lecture 3) ===== */
{t:"vm", s:"L3", f:"Virtual memory", zh:"虚拟内存", b:`<ul><li>Gives each process ${Z("进程")} its own <b>virtual address space</b></li><li>Uses physical memory as a <b>cache for secondary storage</b></li><li>Moves data in units called <b>pages</b></li><li>Provides <b>protection and isolation</b> ${Z("隔离")} between processes</li></ul>`},
{t:"vm", s:"L3", f:"Page", zh:"页", b:`<p>The fixed-size unit of data moved between main memory and storage in virtual memory (e.g. 4 KB).</p>${KEY("Page offset bits = log₂(page size). 4 KB = 2¹² → 12 bits.")}`},
{t:"vm", s:"L3", f:"Address translation", zh:"地址转换", b:`<p>A virtual address = <b>Virtual Page Number</b> + <b>page offset</b>. The VPN is translated to a Physical Page Number; the offset stays the same.</p>${EX("32-bit address, 4 KB page → 20-bit VPN, 12-bit offset.")}`},
{t:"vm", s:"L3", f:"Page table", zh:"页表", b:`<p>A table in memory that stores the virtual → physical page mappings ${Z("映射")}. One entry per virtual page.</p><p><span class="f">Size = #virtual pages × PTE size</span></p>${EX("2²⁰ pages × 4 B = 4 MB")}`},
{t:"vm", s:"L3", f:"Page Table Entry (PTE) and protection", zh:"页表项与保护", b:`<p>Each PTE stores the physical page number plus permission bits ${Z("权限位")}:</p><ul><li><b>Read</b>: can the process read the page?</li><li><b>Write</b>: can it change the page?</li><li><b>Execute</b>: can code run from the page?</li></ul><p>Only the <b>operating system</b> can change these permissions.</p>`},
{t:"vm", s:"L3", f:"TLB — Translation Lookaside Buffer", zh:"快表/转换后备缓冲器", b:`<p>A small, fast <b>cache of recent address translations</b> (VPN → PPN). Without it, every memory access would also need a slow page-table lookup.</p>`},
{t:"vm", s:"L3", f:"TLB hit vs. TLB miss", zh:"TLB 命中/缺失", b:`<p><b>TLB hit</b>: the translation is in the TLB → found quickly.</p><p><b>TLB miss</b>: the translation must be read from the page table in memory → slower.</p>`}
];

/* ---------- state ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
CARDS.forEach((c, i) => c.id = i);
let known = new Set(store.get("cecs530-known", []));
let topic = store.get("cecs530-topic", "all");
let onlyNew = false;
let order = [];
let pos = 0;
let flipped = false;

const $ = id => document.getElementById(id);

function build() {
  let list = CARDS.filter(c => topic === "all" || c.t === topic);
  if (onlyNew) list = list.filter(c => !known.has(c.id));
  order = list.map(c => c.id);
  pos = Math.min(pos, Math.max(0, order.length - 1));
}

function renderTabs() {
  const defs = [["all", "All"], ...Object.entries(TOPICS)];
  $("tabs").innerHTML = defs.map(([k, label]) => {
    const n = CARDS.filter(c => k === "all" || c.t === k).length;
    return `<button class="tab" data-k="${k}" aria-pressed="${k === topic}">${label}<span class="n">${n}</span></button>`;
  }).join("");
  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => {
    topic = b.dataset.k; store.set("cecs530-topic", topic); pos = 0; flipped = false;
    build(); renderTabs(); render();
  });
}

function render() {
  const pool = CARDS.filter(c => topic === "all" || c.t === topic);
  const k = pool.filter(c => known.has(c.id)).length;
  $("knownTxt").textContent = `${k} of ${pool.length} known`;
  $("bar").style.width = pool.length ? (k / pool.length * 100) + "%" : "0";
  $("controls").hidden = order.length === 0;

  if (!order.length) {
    $("count").textContent = "0 / 0";
    $("stage").innerHTML = `<div class="empty"><strong>All cards in this set are marked “known”.</strong>Uncheck the filter above to review them again, or reset progress.</div>`;
    return;
  }
  const c = CARDS[order[pos]];
  $("count").textContent = `${pos + 1} / ${order.length}`;
  const status = known.has(c.id) ? "✓ known" : "learning";
  $("stage").innerHTML = `
    <div class="scene">
      <div class="card${flipped ? " flipped" : ""}" id="card" tabindex="0" role="button" aria-label="Flashcard. Press space to flip.">
        <div class="face front" aria-hidden="${flipped}">
          <div class="meta"><span class="src">${c.s} · ${TOPICS[c.t]}</span><span>${status}</span></div>
          <div class="term"><h2>${c.f}</h2><span class="zhterm">${c.zh}</span></div>
          <div class="prompt">Define it in your own words, then tap to flip.</div>
        </div>
        <div class="face back" aria-hidden="${!flipped}">
          <div class="meta"><span class="src">${c.f}</span><span>${status}</span></div>
          <div class="def">${c.b}</div>
          <div class="hint">Tap to flip back</div>
        </div>
      </div>
    </div>`;
  $("card").onclick = flip;
}

function flip() {
  const el = $("card"); if (!el) return;
  flipped = !flipped;
  el.classList.toggle("flipped", flipped);
  el.querySelector(".front").setAttribute("aria-hidden", flipped);
  el.querySelector(".back").setAttribute("aria-hidden", !flipped);
}
function go(d) { if (!order.length) return; pos = (pos + d + order.length) % order.length; flipped = false; render(); }
function mark(isKnown) {
  if (!order.length) return;
  const id = order[pos];
  isKnown ? known.add(id) : known.delete(id);
  store.set("cecs530-known", [...known]);
  if (onlyNew && isKnown) { build(); flipped = false; render(); }
  else go(1);
}

$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("again").onclick = () => mark(false);
$("got").onclick = () => mark(true);
$("onlyNew").onchange = e => { onlyNew = e.target.checked; pos = 0; flipped = false; build(); render(); };
$("shuffle").onclick = () => {
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  pos = 0; flipped = false; render();
};
$("reset").onclick = () => { known = new Set(); store.set("cecs530-known", []); build(); render(); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === " " || e.key === "Enter") { if (e.target.tagName === "BUTTON" && e.target.id !== "card") return; e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "1") mark(false);
  else if (e.key === "2") mark(true);
});

if (!["all", ...Object.keys(TOPICS)].includes(topic)) topic = "all";
build(); renderTabs(); render();
</script>
</body>
</html>
