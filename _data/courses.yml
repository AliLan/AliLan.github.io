- slug: advanced-software-technology
  name: Advanced Software Technology
  name_zh: 高级软件技术
  items:
    - title: Enhancing Requirement Analysis with Hybrid AI-Based Question Answering Systems
      title_zh: 基于混合 AI 问答系统的需求分析增强
      summary: >-
        Co-authored and presented at SEET 2026. Combines BM25, BGE embeddings,
        Reciprocal Rank Fusion (RRF), and cross-encoder re-ranking for
        requirement analysis. Evaluated on 387 requirement QA pairs, it improved
        retrieval recall by up to 13.3% with higher nDCG ranking quality.
      summary_zh: >-
        SEET 2026 论文（合著并现场汇报）。结合 BM25、BGE 向量嵌入、倒数排名融合（RRF）和交叉编码器重排序做需求分析，在 387 组需求问答对上评测，检索召回率最高提升 13.3%，nDCG 排序质量也更高。
      pdf: /assets/papers/seet2026-hybrid-qa-requirement-analysis.pdf

