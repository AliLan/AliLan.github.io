---
layout: default
---
{%- assign words = content | strip_html | number_of_words -%}
<div class="container">
  <article class="prose page-head">
    <a class="back" href="{{ '/blog/' | relative_url }}">← All posts</a>
    <h1>{{ page.title }}</h1>
    <p class="muted" style="font-size:14px;margin:0 0 32px">{{ page.date | date: "%b %-d, %Y" }} · {{ words | divided_by: 200 | plus: 1 }} min read</p>
    {{ content }}
  </article>
</div>
